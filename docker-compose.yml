version: "3.9"

# One command to run the entire stack against real PostgreSQL instead of the
# zero-install H2 default. Everything here is a free, open-source image — no
# paid services, no API keys required to start.
#
#   docker compose up --build
#
# Backend:  http://localhost:8080  (Swagger UI at /swagger-ui.html)
# Frontend: http://localhost:5173

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicitybrain
      POSTGRES_USER: aicitybrain
      POSTGRES_PASSWORD: aicitybrain
    ports:
      - "5432:5432"
    volumes:
      - novacity-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicitybrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aicitybrain
      DB_USER: aicitybrain
      DB_PASSWORD: aicitybrain
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-key-change-me-before-deploying-anywhere-please-1234567890}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AI_PROVIDER: ${AI_PROVIDER:-rule-based}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_WS_BASE_URL: ws://localhost:8080
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  novacity-pgdata:
