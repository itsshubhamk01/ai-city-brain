spring:
  application:
    name: ai-city-brain

  # --- Default profile: "local" — zero install, file-based H2, no Docker required ---
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  security:
    filter:
      order: 10

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always
    include-binding-errors: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # Zero-cost dev default — override with a long random string via env var in any real deployment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-key-change-me-before-deploying-anywhere-please-1234567890}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  simulation:
    tick-interval-ms: ${SIM_TICK_INTERVAL_MS:4000}
    autostart: ${SIM_AUTOSTART:false}
  ai:
    # Free by default: rule-based natural-language insight generator, no external API needed.
    # Set provider=llm and ANTHROPIC_API_KEY (or OPENAI_API_KEY) to swap in a real model — see docs/ARCHITECTURE.md.
    provider: ${AI_PROVIDER:rule-based}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    # Cheapest current Claude model — sensible default for an opt-in, pay-if-you-enable-it feature.
    anthropic-model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.aicitybrain: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

---
# ============================================================
# LOCAL PROFILE — the default. File-based H2 database.
# Requires nothing but a JDK + Maven. No Docker, no Postgres, no cost.
# ============================================================
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/ai-city-brain;MODE=PostgreSQL;DATABASE_TO_UPPER=false;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none  # schema is fully owned by Flyway migrations (see db/migration) - see docs/ARCHITECTURE.md
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

---
# ============================================================
# DOCKER / POSTGRES PROFILE — closer to a real deployment.
# Used automatically by docker-compose (still 100% free/open-source images).
# ============================================================
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aicitybrain}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:aicitybrain}
    password: ${DB_PASSWORD:aicitybrain}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none  # schema is fully owned by Flyway migrations (see db/migration) - see docs/ARCHITECTURE.md
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

---
# ============================================================
# TEST PROFILE — in-memory H2, fresh schema per test run.
# ============================================================
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_UPPER=false;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none  # schema is fully owned by Flyway migrations (see db/migration) - see docs/ARCHITECTURE.md
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  simulation:
    autostart: false
